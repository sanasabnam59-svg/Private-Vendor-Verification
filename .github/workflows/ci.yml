name: Private Vendor Verification CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Compact AST & Circuit Manifests
        run: npm run compile:compact

      - name: Run Automated Test Suite (38 Tests)
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build
