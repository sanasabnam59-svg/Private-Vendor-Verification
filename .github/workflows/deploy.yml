name: Midnight Preview Deployment Verification

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  verify-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Midnight Preview Contract
        run: node scripts/deploy-runner.mjs
